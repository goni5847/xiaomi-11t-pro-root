name: Build Xiaomi 11T Pro (vili) Kernel

# ============================================================================
# ⚠️  IMPORTANT COMPATIBILITY WARNING — READ BEFORE RUNNING
# ============================================================================
# The only kernel source Xiaomi has published for `vili` is tagged for
# Android R (vili-r-oss, base LA.UM.9.14.r1-16700-LAHAINA.0) — there is no
# Android T (MIUI 14) branch.
#
# Compiling this source and flashing the resulting Image into a boot.img
# built for stock MIUI 14 (Android 13) userspace is very likely to bootloop.
# This isn't a scripting problem — it's a mismatch between the kernel's
# ABI/SELinux policy/vendor HAL interfaces and what MIUI 14 userspace
# expects. Community `vili` kernel builds are paired exclusively with
# matching AOSP-based ROMs (e.g. crDroid, LineageOS, PixelOS, DerpFest) that
# ship their own compatible userspace — none are used as drop-in
# replacements for the stock MIUI kernel.
#
# If your goal is root only, you don't need this workflow — Magisk-patching
# the stock boot.img (as in Phase 2 of the rooting doc) does not touch the
# kernel binary and carries none of this risk.
#
# If your goal is a custom kernel, the realistic path is flashing a full
# custom ROM built for vili, not swapping just the kernel Image into MIUI.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source Repository URL'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_BRANCH:
        description: 'Branch to compile (only vili-r-oss exists for this device)'
        required: true
        default: 'vili-r-oss'
      DEFCONFIG:
        description: 'Defconfig file name (verify this against the repo — see Phase 0 step below)'
        required: true
        default: 'vili_defconfig'

jobs:
  build-kernel:
    # ubuntu-22.04 dropped several ncurses/libncurses5 packages this
    # toolchain expects — 20.04 matches the era this build script was
    # written for and avoids apt-get failing on missing packages.
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Set Up Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Download Proton Clang (Toolchain)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Download Kernel Source
        run: |
          git clone --depth=1 \
            -b "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_SOURCE }}" \
            kernel-source

      - name: Verify Defconfig Exists
        run: |
          cd kernel-source
          DEFCONFIG_PATH=$(find arch/arm64/configs/ -name "${{ github.event.inputs.DEFCONFIG }}")
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "::error::Defconfig '${{ github.event.inputs.DEFCONFIG }}' not found under arch/arm64/configs/."
            echo "Available defconfigs:"
            ls arch/arm64/configs/
            exit 1
          fi
          echo "Found defconfig at: $DEFCONFIG_PATH"
          echo "DEFCONFIG_PATH=$DEFCONFIG_PATH" >> "$GITHUB_ENV"

      - name: Inject Docker Flags (cgroups & namespaces)
        run: |
          cd kernel-source
          cat <<EOF >> "$DEFCONFIG_PATH"
          # --- DOCKER AND CONTAINER FLAGS ADDED VIA GITHUB ACTIONS ---
          CONFIG_NAMESPACES=y
          CONFIG_USER_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MACVLAN=y
          CONFIG_DUMMY=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_VS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_OVERLAY_FS=y
          # -----------------------------------------------------------
          EOF

      - name: Compile the Kernel
        run: |
          cd kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang

          # Prepare compilation (ARCH/CROSS_COMPILE must match the build step
          # below, or the defconfig can be generated for the wrong target)
          make O=out \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               "${{ github.event.inputs.DEFCONFIG }}"

          # Build the kernel
          make -j"$(nproc --all)" O=out \
               ARCH=arm64 \
               CC=clang \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 \
               LLVM_IAS=1

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled_Kernel_Image
          path: kernel-source/out/arch/arm64/boot/Image